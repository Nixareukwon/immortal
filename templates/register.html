<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="csrf-token" content="{{csrf_token}}">
  <meta name="theme-color" content="#0b0e14">
  <title>Вход · Immortal</title>
  <link rel="icon" href="/static/mark.svg?v=3" type="image/svg+xml">
  <link rel="stylesheet" href="/static/panel.css?v=7">
  <link rel="stylesheet" href="/static/studio.css?v=4">
  <script src="/static/accounts.js?v=2" defer></script>
</head>
<body class="login-page">
  <div class="login-layout">
    <section class="login-art" aria-label="Immortal — панель Twitch-бота">
      <div class="brand"><img class="brand-mark" src="/static/mark.svg?v=3" alt="" width="34" height="34"><span>immortal<span class="brand-caption">Панель Twitch-бота</span></span></div>
      <img class="automation-art" src="/static/automation.svg?v=3" alt="" width="480" height="400">
      <h2>Ваш эфир.<br>Ваши правила.</h2>
      <p>Команды, автоматизация и модерация.<br>Больше времени для вашего сообщества.</p>
    </section>
    <main class="login-card">
      <div class="brand"><img class="brand-mark" src="/static/mark.svg?v=3" alt="" width="34" height="34"><span>immortal</span></div>
      <h1>Ваш аккаунт</h1>
      <p class="lead">Задайте личный пароль для доступа к общему боту.</p>
      <form id="register">
        <label class="field"><span class="field-label">Логин</span><input name="username" autocomplete="username" pattern="[a-zA-Z0-9_]{3,32}" placeholder="3–32 латинские буквы, цифры или _" required></label>
        <label class="field"><span class="field-label">Пароль</span><input name="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" placeholder="Не менее 12 символов" required></label>
        <label class="field"><span class="field-label">Повторите пароль</span><input name="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" required></label>
        <button class="button primary" type="submit">Создать аккаунт</button>
        <p id="message" role="status"></p>
      </form>
      <a href="/login">Уже есть аккаунт? Войти</a>
    </main>
  </div>
</body>
</html>
